# mc-rag Nginx 反向代理配置
# 部署时复制到: /etc/nginx/sites-available/mc-rag.conf
#
# 使用方法:
#   sudo cp deploy/nginx/mc-rag.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/mc-rag.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# 限流区域定义（放在 http 块中，如果已定义请注释掉下面这行）
# limit_req_zone $binary_remote_addr zone=mcrag:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;
    # 有域名后改为: server_name your-domain.com;

    # 请求频率限制（需配合 http 块中的 limit_req_zone）
    # limit_req zone=mcrag burst=20 nodelay;

    # 客户端请求体大小限制
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit 需要 WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # LLM 生成可能需要较长时间
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 禁用缓冲以支持流式输出
        proxy_buffering off;
    }

    # Streamlit 静态资源缓存
    location /static/ {
        proxy_pass http://127.0.0.1:8501/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Streamlit 健康检查端点
    location /_stcore/health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Streamlit 内部通信端点
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
